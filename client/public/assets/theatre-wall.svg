    <text x="155" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="82" fill="#1b1814">“</text>
    <text x="155" y="145" text-anchor="middle" font-family="Georgia, serif" font-size="38" font-weight="800" fill="#1b1814">শিল্পই পারে</text>
    <text x="155" y="198" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#1b1814">সত্যকে ধরাতে</text>
  </g>
