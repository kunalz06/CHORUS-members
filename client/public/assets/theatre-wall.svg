<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Vintage theatre collage wall</title>
  <desc id="desc">A monochrome theatre-themed background with paper notices, masks, tickets, and stage motifs.</desc>
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="6" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0.18 0.5" />
      </feComponentTransfer>
    </filter>
    <linearGradient id="paper" x1="0" x2="1">
      <stop stop-color="#d7d0bf" />
      <stop offset="1" stop-color="#a99f8e" />
    </linearGradient>
  </defs>
  <rect width="1400" height="900" fill="#d8d1c0" />
  <rect width="1400" height="900" filter="url(#rough)" opacity="0.7" />
  <g opacity="0.28" fill="none" stroke="#221f1a" stroke-width="3">
    <path d="M42 790c190-120 330-108 510-58 130 36 265 47 402-5 144-55 242-30 392 52" />
    <path d="M0 210c188 42 298 25 458-35 118-44 215-43 327 4 162 67 331 44 615-35" />
  </g>
  <g transform="translate(92 112) rotate(-3)">
    <rect width="290" height="330" rx="10" fill="url(#paper)" stroke="#30291f" stroke-width="6" />
    <text x="145" y="78" text-anchor="middle" font-family="Georgia, serif" font-size="44" font-weight="900" fill="#1b1814">আজকের নাটক</text>
    <text x="145" y="146" text-anchor="middle" font-family="Georgia, serif" font-size="58" font-weight="900" fill="#1b1814">রক্তকরবী</text>
    <path d="M52 190h186M52 221h150M52 252h210" stroke="#1b1814" stroke-width="5" />
  </g>
  <g transform="translate(430 92) rotate(4)">
